name: Atualizar taxas

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar rates.json
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 scripts/update.py
      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rates.json
          git diff --cached --quiet || git commit -m "Atualiza taxas"
          git push
